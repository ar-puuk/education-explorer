[project]
name = "nces-pipeline"
version = "0.1.0"
description = "Local preprocessing pipeline for the NCES Education Explorer"
requires-python = ">=3.13"
dependencies = [
    "duckdb",
    "httpx",
    "pyyaml",
    "pyarrow",
    "zipfile-deflate64>=0.2.0",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nces_pipeline"]

[tool.ruff]
line-length = 100
