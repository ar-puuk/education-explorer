# Human-curated caveats shown next to data in the app. Keys are "<dataset>.<table>" or
# "<dataset>.<table>.<column>". Keep statements factual and tied to NCES documentation;
# the app never ranks schools or implies quality.
ccd.school_directory:
  caveat: >-
    Status (Open, Closed, New, Future, Changed Boundary/Agency...) is as reported for that school year.
    The latest year may be a preliminary NCES release (see data_version) and can change.
ccd.membership:
  caveat: >-
    Counts are as reported by the state for the fall membership count date. Rows labelled "No Category Codes"
    or "Not Specified" are totals or unclassified students, and "Derived" or "Education Unit Total" rows are
    subtotals; do not add them to the detail rows. Counts can be suppressed, missing or not reported (see value_flag).
    Race/ethnicity categories were revised in 2009-10 (adding "Two or more races"), so older detail is not
    strictly comparable. In 1997-98 to 2013-14 some states or schools reported totals without race/sex detail
    (RACECAT in the legacy files), so detail rows may not add up to the total.
ccd.district_membership:
  caveat: >-
    Same conventions as school membership. District totals may differ slightly from the sum of school rows
    because of reconciliation and adult-education adjustments.
ccd.lunch:
  caveat: >-
    Free and reduced-price lunch counts are not comparable across schools or years when a school or district
    participates in the Community Eligibility Provision (CEP) or similar provisions, because eligibility may be
    reported for all students or carried forward. Direct certification counts follow a different definition.
ccd.staff:
  caveat: Staff are reported as full-time equivalent (FTE). Counts may be missing or suppressed (see value_flag).
ccd.district_staff:
  caveat: Staff are reported as full-time equivalent (FTE). Category definitions changed across years.
ccd.school_location:
  caveat: >-
    Locations come from the NCES EDGE school geocodes. Where EDGE had not yet been released for a school year,
    the coordinates of the school's most recent earlier EDGE record are used (coord_source = edge_prior_year).
    Schools may have moved; some schools have no coordinates.
ccd.school_characteristics:
  caveat: Title I, magnet, virtual and shared-time statuses are reported by states and their definitions evolved over time.
ipeds.hd:
  caveat: >-
    Directory information is as reported for each collection year. Coordinates exist only from about 2008, so
    institutions that closed earlier have no map location. Negative codes (for example -2, -3) mean not applicable or
    not available; see the value labels.
ipeds.efa:
  caveat: >-
    Fall enrollment by level, attendance and race/ethnicity (efalevel selects the row). Race/ethnicity categories were
    revised in 2010 (adding "Two or more races" and a new Hispanic reporting rule), so race detail before 2010 uses
    different columns and is not directly comparable. Totals are comparable across years.
ipeds.effy:
  caveat: 12-month unduplicated headcount for the academic year ending in the file year. It is not the same as fall enrollment.
ipeds.ca:
  caveat: >-
    Completions are awards conferred (not students) during the academic year ending in the file year, by program (CIP)
    and award level. First and second majors are separate rows (majornum).
ipeds.sfa:
  caveat: >-
    Columns that end in a digit (for example npist0, npist1, npist2) are positional: each file reports the three most
    recent award years, so the same column name refers to different years in different files. The years in a label
    apply to the newest file only. Net price figures describe students receiving aid and are not a quote for any student.
ipeds.ff1a:
  caveat: >-
    Finance forms differ by institutional type: F1A (public, GASB), F2 (private not-for-profit or public using FASB) and
    F3 (private for-profit). Items and definitions are not directly comparable across forms. Values are in dollars and
    can legitimately be negative.
ipeds.ff2:
  caveat: Finance form F2 (private not-for-profit, or public using FASB). Not directly comparable with F1A or F3. Values can be negative.
ipeds.ff3:
  caveat: Finance form F3 (private for-profit). Not directly comparable with F1A or F2. Values can be negative.
ipeds.gr:
  caveat: >-
    Graduation rates track a cohort of first-time, full-time degree/certificate-seeking students for 150 percent of
    normal program time. The rows (grtype, chrtstat) are cohort counts, exclusions and completions; compute rates only
    from rows that share a cohort. Part-time, transfer-in and returning students are not included.
ipeds.adm:
  caveat: Admissions data apply to institutions with selective admissions for first-time undergraduates; open-admission institutions may not report.
ipeds.flags:
  caveat: Response status codes for each survey component; useful for understanding why a component is missing for an institution-year.
pss.schools:
  caveat: >-
    The Private School Universe Survey is conducted every two years (fall of the first year shown, for example
    2023-24); years between surveys are not missing data, they were not collected. School names and permanent IDs (PPIN)
    are in the public-use files from 2005-06 on (PPIN also in 1993-94, 2001-02 and 2003-04), so earlier surveys cannot be
    linked to individual schools or placed on the map. Questionnaire item numbers (P###) are specific to each survey, and
    value labels come from the 2023-24 codebook; definitions can differ in earlier surveys. Counts are as reported or
    imputed by NCES (see the *_flag columns); private schools in the universe may be missed or may have closed.
pss.enrollment:
  caveat: >-
    Long format derived from the survey's grade-level (P140-P300), race (P310-P332), sex (P340) and total (P305,
    NUMSTUDS) items. Race categories changed in 2009-10. Negative source codes are treated as not applicable and
    blank values as missing (value NULL, never 0).
pss.teachers:
  caveat: Long format derived from the teacher headcount items (P385-P410), full-time-equivalent teachers (NUMTEACH) and the student-teacher ratio (STTCH_RT).
ccd.district_finance:
  caveat: >-
    Annual survey of local government school system finances (F-33), in dollars, for the fiscal year that ends in the
    school year shown (for example 2023 = FY2024 is labelled 2023-24 here only by file release). Column names are NCES
    codes; labels come from the NCES companion file for the newest release and some items changed over time. Values of
    -1 (missing), -2 (not applicable) and -3 (suppressed) are NULL with a flag; other negative amounts are real.
    Charter and some other agencies are not covered. Amounts are not adjusted for inflation.
ccd.district_graduates:
  caveat: Counts of regular high school diploma recipients and other completers (not a graduation rate). Counts can be suppressed or missing (see value_flag).
ccd.district_dropout:
  caveat: Counts of students who dropped out of grades 9-12 (not a dropout rate). Reporting rules differ by state and some counts are suppressed.
ccd.legacy_school:
  caveat: >-
    The school universe file exactly as NCES published it for 1997-98 to 2013-14 (all columns; names lower-cased and the
    survey-year suffix removed). Negative codes (-1 missing, -2 not applicable, -9 not meeting standards) and M/N are
    left as published here; the harmonized tables (directory, membership, lunch, staff) convert them to empty values with flags.
ccd.legacy_district:
  caveat: The district (agency) universe file as published for 1998-99 to 2013-14 (all columns; the 1997-98 file has no machine-readable version). Codes as published.
